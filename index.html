    <style>
        body {
            background: #000;
            /* fundo preto */
            color: #fff;
            /* texto branco */
            font-family: 'Arial', sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            text-align: center;
        }

        canvas {
            cursor: pointer;
        }

        h1 {
            font-size: 3rem;
            color: #00ffff;
            margin-bottom: 10px;
            text-shadow: 2px 2px 8px #0ff;
        }

        h2 {
            font-size: 1.8rem;
            color: #ffcc00;
            margin-bottom: 8px;
            text-shadow: 1px 1px 5px #fc0;
        }

        h3 {
            font-size: 1.2rem;
            color: #ccc;
            text-shadow: 1px 1px 3px #888;
        }
    </style>
</head>

<body>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <h1>Terra 3D Interativa</h1>
    <h2>Gire, pause e explore a Terra em 3D no navegador</h2>
    <h3>Desenvolvido com Three.js</h3>

    <script>

        const scene = new THREE.Scene();

        const camera = new THREE.PerspectiveCamera(
            75,
            window.innerWidth / window.innerHeight,
            0.1,
            1000
        );

        const renderer = new THREE.WebGLRenderer({
            antialias: false,
            depth: false,
            stencil: false,
            alpha: false
        });

        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));


        document.body.appendChild(renderer.domElement);


        // 🌍 geometria otimizada
        const geometry = new THREE.SphereGeometry(2, 64, 64);

        const texture = new THREE.TextureLoader().load("earth_atmos_512.webp");

        const material = new THREE.MeshBasicMaterial({ map: texture });

        const globe = new THREE.Mesh(geometry, material);

        scene.add(globe);

        camera.position.z = 5;

        let spinning = true;


        // clicar para parar / rodar
        renderer.domElement.addEventListener("click", () => {
            spinning = !spinning;
        });


        // ajustar tela
        window.addEventListener("resize", () => {

            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();

            renderer.setSize(window.innerWidth, window.innerHeight);

        });


        function animate() {

            requestAnimationFrame(animate);

            if (spinning) {
                globe.rotation.y += 0.0090;
            }

            renderer.render(scene, camera);

        }

        animate();

    </script>

</body>
