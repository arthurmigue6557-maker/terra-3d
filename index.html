<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="description" content="Globo 3D interativo que gira no navegador; clique para pausar ou continuar a rotação da Terra.">
<!-- Open Graph -->
<meta property="og:title" content="Terra 3D Interativa">
<meta property="og:description" content="Explore a Terra em 3D, clique para pausar ou continuar a rotação.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://terra-3d.vercel.app">
<meta property="og:image" content="https://terra-3d.vercel.app/earth_512.webp">
<link rel="icon" href="https://terra-3d.vercel.app/earth_512.webp" type="image/webp">
<!-- Twitter Cards-->
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Terra 3D Interativa">
<meta name="twitter:description" content="Explore a Terra em 3D, clique para pausar ou continuar a rotação.">
<meta name="twitter:image" content="https://terra-3d.vercel.app/earth_256.webp">
<title>Globo 3D</title>

<style>

body{
margin:0;
background:#161414;
overflow:hidden;
}

canvas{
cursor:pointer;
}

</style>
</head>

<body>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script>

const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(
75,
window.innerWidth/window.innerHeight,
0.1,
1000
);

const renderer = new THREE.WebGLRenderer({
antialias:false,
depth:false,
stencil:false,
alpha:false
});

renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));


document.body.appendChild(renderer.domElement);


// 🌍 geometria otimizada
const geometry = new THREE.SphereGeometry(2,64,64);

const texture = new THREE.TextureLoader().load("earth_atmos_512.webp");

const material = new THREE.MeshBasicMaterial({map:texture});

const globe = new THREE.Mesh(geometry,material);

scene.add(globe);

camera.position.z = 5;

let spinning = true;


// clicar para parar / rodar
renderer.domElement.addEventListener("click",()=>{
spinning = !spinning;
});


// ajustar tela
window.addEventListener("resize",()=>{

camera.aspect = window.innerWidth/window.innerHeight;
camera.updateProjectionMatrix();

renderer.setSize(window.innerWidth,window.innerHeight);

});


function animate(){

requestAnimationFrame(animate);

if(spinning){
globe.rotation.y += 0.0090;
}

renderer.render(scene,camera);

}

animate();

</script>

</body>
</html>
